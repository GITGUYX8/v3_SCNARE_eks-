apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ros-production-cluster
  region: ap-northeast-1 # Tokyo region
  version: "1.29" # Stable K8s version

# We create a dedicated group of EC2 worker nodes
managedNodeGroups:
  - name: standard-workers
    instanceType: t3.medium # 2 vCPU, 4GB RAM (Good baseline for ROS2)
    minSize: 1
    maxSize: 3 # It will automatically add more servers if lots of students join!
    desiredCapacity: 1
    volumeSize: 20
    ssh:
      allow: true
